# FILE_NAME: catalog-info.yaml
# DESCRIPTION: Root Location for IDP Backstage catalog + all Software Templates
# VERSION: 1.1.0
# AUTHORS: ravichandrapatel

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: idp-backstage-templates
  description: DevZero IDP catalog entities, org model, and Software Templates
spec:
  targets:
    - ./catalog/entities.yaml
    - ./catalog/org.yaml
    - ./catalog/cluster-labs.yaml
    - ./templates/example-nodejs/template.yaml
    - ./templates/namespace-as-service/template.yaml
