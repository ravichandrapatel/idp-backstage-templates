# FILE_NAME: template.yaml
# DESCRIPTION: Backstage template — create NaaS tenant Application under env/cluster/tenant.yaml
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: namespace-as-service
  title: Namespace as a Service
  description: >
    Create a tenant namespace via Namespace-as-a-Service. Generates an Argo CD
    Application parameter file and pushes it to idp-argocd-apps at
    env/<env>/<clusterName>/<tenant>.yaml (namespace == tenant).
  tags:
    - kubernetes
    - helm
    - naas
    - argocd
    - multi-tenant
  annotations:
    backstage.io/source-template: namespace-as-service
spec:
  owner: group:default/platform
  type: resource

  parameters:
    - title: Tenant & placement
      required:
        - tenant
        - env
        - clusterName
        - environments
        - instanceSize
        - owner
      properties:
        tenant:
          title: Tenant / namespace
          type: string
          description: >
            Tenant id. Becomes the Argo CD app identity and file name
            (env/.../<tenant>.yaml). Workload namespaces are {tenant}-{envSuffix}.
          pattern: '^[a-z][a-z0-9-]{1,30}$'
          ui:autofocus: true
        env:
          title: Environment
          type: string
          description: Top-level folder under env/ (e.g. nonprod, prod).
          enum:
            - nonprod
            - prod
            - sandbox
          default: nonprod
        clusterName:
          title: Cluster name
          type: string
          description: Destination cluster name registered in Argo CD (folder under env/<env>/).
          pattern: '^[a-z][a-z0-9-]{1,40}$'
        environments:
          title: Workload environment suffixes
          type: array
          description: Creates namespaces {tenant}-{suffix} for each entry.
          default: [dev, uat]
          minItems: 1
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,20}$'
          uniqueItems: true
        instanceSize:
          title: Default instance size
          type: string
          default: kgen.medium
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - kgen.2xlarge
            - kgen.4xlarge
            - km.medium
            - km.large
            - km.xlarge
            - km.2xlarge
            - km.4xlarge
            - kc.medium
            - kc.large
            - kc.xlarge
            - kc.2xlarge
            - kc.4xlarge
            - kgpu.medium
            - kgpu.large
            - kgpu.xlarge
            - kgpu.2xlarge
            - kgpu.4xlarge
            - custom
        groups:
          title: RBAC groups
          type: array
          description: Entra / Okta / AD groups bound to tenant Roles.
          default: []
          items:
            type: string
          ui:options:
            addable: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group, User]

    - title: Platform options
      properties:
        enableArgoCD:
          title: Enable namespaced Argo CD
          type: boolean
          default: true
        enableTekton:
          title: Enable Tekton RBAC
          type: boolean
          default: true
        devopsInstanceSize:
          title: Devops namespace size
          type: string
          default: kgen.large
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - km.medium
            - km.large
            - kc.medium
            - kc.large
        chartVersion:
          title: Chart version
          type: string
          default: "1.0.0"
          pattern: '^\d+\.\d+\.\d+(-rc\.\d+)?$'
        project:
          title: Argo CD project
          type: string
          default: default

  steps:
    - id: fetch-app
      name: Generate Argo CD tenant Application file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./naas-app
        values:
          tenant: ${{ parameters.tenant }}
          env: ${{ parameters.env }}
          clusterName: ${{ parameters.clusterName }}
          environments: ${{ parameters.environments }}
          instanceSize: ${{ parameters.instanceSize }}
          groups: ${{ parameters.groups if parameters.groups else [] }}
          owner: ${{ parameters.owner }}
          enableArgoCD: ${{ parameters.enableArgoCD }}
          enableTekton: ${{ parameters.enableTekton }}
          devopsInstanceSize: ${{ parameters.devopsInstanceSize }}
          chartVersion: ${{ parameters.chartVersion }}
          project: ${{ parameters.project }}

    - id: publish-argocd-apps
      name: Push to idp-argocd-apps (env/cluster/tenant.yaml)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=ravichandrapatel&repo=idp-argocd-apps
        branchName: backstage/naas-${{ parameters.tenant }}-${{ parameters.clusterName }}
        targetBranchName: main
        title: "feat(naas): add ${{ parameters.tenant }} on ${{ parameters.env }}/${{ parameters.clusterName }}"
        description: |
          Backstage scaffolder created Namespace-as-a-Service tenant **${{ parameters.tenant }}**.

          Path: `env/${{ parameters.env }}/${{ parameters.clusterName }}/${{ parameters.tenant }}.yaml`
        sourcePath: ./naas-app
        targetPath: env/${{ parameters.env }}/${{ parameters.clusterName }}
        commitMessage: "feat(naas): add ${{ parameters.tenant }} (${{ parameters.env }}/${{ parameters.clusterName }})"
        update: true
        gitAuthorName: ravichandrapatel
        gitAuthorEmail: cheetiravi@gmail.com

  output:
    links:
      - title: Argo CD apps PR
        url: ${{ steps['publish-argocd-apps'].output.remoteUrl }}
      - title: Expected path on main
        url: https://github.com/ravichandrapatel/idp-argocd-apps/blob/main/env/${{ parameters.env }}/${{ parameters.clusterName }}/${{ parameters.tenant }}.yaml
      - title: Chart
        url: https://github.com/ravichandrapatel/namespace-as-service
    text:
      - title: GitOps path
        content: |
          `env/${{ parameters.env }}/${{ parameters.clusterName }}/${{ parameters.tenant }}.yaml`

          The PR is auto-merged by `.github/workflows/auto-merge-backstage.yaml` in `idp-argocd-apps`.
          ApplicationSet `namespace-as-service` then syncs the tenant Helm release.
