# FILE_NAME: template.yaml
# DESCRIPTION: Backstage template — create NaaS tenant Application under env/cluster/tenant.yaml
# VERSION: 1.1.1
# AUTHORS: ravichandrapatel

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: namespace-as-service
  title: Namespace as a Service
  description: >
    Create a tenant namespace via Namespace-as-a-Service. Generates an Argo CD
    Application parameter file and pushes it to idp-argocd-apps at
    env/<env>/<clusterName>/<tenant>.yaml (namespace == tenant).
  tags:
    - kubernetes
    - helm
    - naas
    - argocd
    - multi-tenant
  annotations:
    backstage.io/source-template: namespace-as-service
    # Pin portal locations to git tag template-namespace-as-service-vX.Y.Z for releases
    ravichandrapatel.com/template-version: "1.1.1"
    ravichandrapatel.com/template-git-tag: template-namespace-as-service-v1.1.1
spec:
  owner: group:default/platform
  type: resource

  parameters:
    - title: Tenant & placement
      required:
        - tenant
        - env
        - clusterEntity
        - environments
        - instanceSize
        - owner
      properties:
        tenant:
          title: Tenant / namespace
          type: string
          description: >
            Tenant id. Becomes the Argo CD app identity and file name
            (env/.../<tenant>.yaml). Workload namespaces are {tenant}-{envSuffix}.
          pattern: '^[a-z][a-z0-9-]{1,30}$'
          ui:autofocus: true
          ui:help: Lowercase DNS label; validated by JSON Schema pattern before submit.
        env:
          title: Environment
          type: string
          description: Top-level folder under env/ (e.g. nonprod, prod).
          enum:
            - nonprod
            - prod
            - sandbox
          default: nonprod
          ui:help: Closed list — only these values are accepted.
        clusterEntity:
          title: Target cluster
          type: string
          description: >
            Must be a catalog Resource with spec.type=kubernetes-cluster.
            metadata.name must match the spoke Git path segment / naas_cluster_name annotation on the spoke in-cluster secret (hub no longer uses destination.name for NaaS).
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            defaultKind: Resource
            catalogFilter:
              - kind: Resource
                spec.type: kubernetes-cluster
          ui:help: >
            Free text is disabled. Only registered clusters from the software catalog appear.
            Register new clusters as Resource entities in idp-backstage-templates/catalog/.
        environments:
          title: Workload environment suffixes
          type: array
          description: Creates namespaces {tenant}-{suffix} for each entry.
          default: [dev, uat]
          minItems: 1
          maxItems: 12
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,20}$'
          uniqueItems: true
        instanceSize:
          title: Default instance size
          type: string
          default: kgen.medium
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - kgen.2xlarge
            - kgen.4xlarge
            - km.medium
            - km.large
            - km.xlarge
            - km.2xlarge
            - km.4xlarge
            - kc.medium
            - kc.large
            - kc.xlarge
            - kc.2xlarge
            - kc.4xlarge
            - kgpu.medium
            - kgpu.large
            - kgpu.xlarge
            - kgpu.2xlarge
            - kgpu.4xlarge
            - custom
          ui:help: Closed enum matching chart presets in templates/_sizes.tpl.
        groups:
          title: RBAC groups
          type: array
          description: Entra / Okta / AD groups bound to tenant Roles.
          default: []
          items:
            type: string
            pattern: '^[A-Za-z0-9._@\\-]{2,128}$'
          ui:options:
            addable: true
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group, User]
          ui:help: Must be an existing User or Group in the catalog.

    - title: Platform options
      required:
        - chartVersion
      properties:
        enableArgoCD:
          title: Enable namespaced Argo CD
          type: boolean
          default: true
        enableTekton:
          title: Enable Tekton RBAC
          type: boolean
          default: true
        devopsInstanceSize:
          title: Devops namespace size
          type: string
          default: kgen.large
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - km.medium
            - km.large
            - kc.medium
            - kc.large
        chartVersion:
          title: Helm chart version (OCI tag)
          type: string
          default: "1.0.0"
          description: >
            Exact chart semver published to
            oci://ghcr.io/ravichandrapatel/charts/namespace-as-service.
            Written into the tenant YAML as chartVersion; ApplicationSet sets
            spec.source.targetRevision to this value (Argo CD pulls that OCI tag).
          # Keep enum in sync with github.com/ravichandrapatel/namespace-as-service/releases
          enum:
            - "1.0.0"
          pattern: '^\d+\.\d+\.\d+(-rc\.\d+)?$'
          ui:help: >
            Prefer picking from the list (released tags). Pattern still blocks malformed versions.
        project:
          title: Argo CD project
          type: string
          default: default
          pattern: '^[a-z][a-z0-9-]{0,62}$'

  steps:
    - id: fetch-app
      name: Generate Argo CD tenant Application file
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./naas-app
        values:
          tenant: ${{ parameters.tenant }}
          env: ${{ parameters.env }}
          # EntityPicker returns resource:default/<name> — use catalog name as Argo cluster name
          clusterName: ${{ parameters.clusterEntity | parseEntityRef | name }}
          clusterEntity: ${{ parameters.clusterEntity }}
          environments: ${{ parameters.environments }}
          instanceSize: ${{ parameters.instanceSize }}
          groups: ${{ parameters.groups if parameters.groups else [] }}
          owner: ${{ parameters.owner }}
          enableArgoCD: ${{ parameters.enableArgoCD }}
          enableTekton: ${{ parameters.enableTekton }}
          devopsInstanceSize: ${{ parameters.devopsInstanceSize }}
          chartVersion: ${{ parameters.chartVersion }}
          project: ${{ parameters.project }}

    - id: publish-argocd-apps
      name: Push to idp-argocd-apps (env/cluster/tenant.yaml)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=ravichandrapatel&repo=idp-argocd-apps
        branchName: backstage/naas-${{ parameters.tenant }}-${{ parameters.clusterEntity | parseEntityRef | name }}
        targetBranchName: main
        title: "feat(naas): add ${{ parameters.tenant }} on ${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }}"
        description: |
          Backstage scaffolder created Namespace-as-a-Service tenant **${{ parameters.tenant }}**.

          - Path: `env/${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }}/${{ parameters.tenant }}.yaml`
          - Chart OCI tag / Argo targetRevision: `${{ parameters.chartVersion }}`
          - Cluster entity: `${{ parameters.clusterEntity }}`
          - Template version: `1.1.0` (`template-namespace-as-service-v1.1.0`)
        sourcePath: ./naas-app
        targetPath: env/${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }}
        commitMessage: "feat(naas): add ${{ parameters.tenant }} (${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }})"
        update: true
        gitAuthorName: ravichandrapatel
        gitAuthorEmail: cheetiravi@gmail.com

  output:
    links:
      - title: Argo CD apps PR
        url: ${{ steps['publish-argocd-apps'].output.remoteUrl }}
      - title: Expected path on main
        url: https://github.com/ravichandrapatel/idp-argocd-apps/blob/main/env/${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }}/${{ parameters.tenant }}.yaml
      - title: Chart release
        url: https://github.com/ravichandrapatel/namespace-as-service/releases/tag/v${{ parameters.chartVersion }}
    text:
      - title: GitOps path & chart pin
        content: |
          Path: `env/${{ parameters.env }}/${{ parameters.clusterEntity | parseEntityRef | name }}/${{ parameters.tenant }}.yaml`

          Argo CD ApplicationSet sets `spec.source.targetRevision` = `${{ parameters.chartVersion }}`
          → pulls `oci://ghcr.io/ravichandrapatel/charts/namespace-as-service:${{ parameters.chartVersion }}`.
