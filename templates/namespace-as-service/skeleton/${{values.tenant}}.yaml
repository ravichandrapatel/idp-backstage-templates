# FILE_NAME: ${{ values.tenant }}.yaml
# DESCRIPTION: NaaS tenant parameters for ApplicationSet (path env/cluster/tenant.yaml)
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel
#
# Consumed by appsets/namespace-as-service.yaml in idp-argocd-apps.
# namespace == tenant

tenant: ${{ values.tenant | dump }}
env: ${{ values.env | dump }}
clusterName: ${{ values.clusterName | dump }}
chartVersion: ${{ values.chartVersion | dump }}
project: ${{ values.project | dump }}
instanceSize: ${{ values.instanceSize | dump }}
enableArgoCD: ${{ values.enableArgoCD }}
enableTekton: ${{ values.enableTekton }}
devopsInstanceSize: ${{ values.devopsInstanceSize | dump }}
owner: ${{ values.owner | dump }}

helmValues: |
  tenant: ${{ values.tenant }}
  instanceSize: ${{ values.instanceSize }}
  namespaces:
{%- for envSuffix in values.environments %}
    - name: ${{ values.tenant }}-${{ envSuffix }}
{%- endfor %}
  namespaceDefaults:
    labels:
      product: ${{ values.tenant }}
      managed-by: backstage
      idp.env: ${{ values.env }}
      idp.cluster: ${{ values.clusterName }}
  groups:
{%- if values.groups and values.groups|length > 0 %}
{%- for group in values.groups %}
    - ${{ group }}
{%- endfor %}
{%- else %}
    - ${{ values.tenant }}-admins
{%- endif %}
  argocd:
    enabled: ${{ values.enableArgoCD }}
  tekton:
    enabled: ${{ values.enableTekton }}
{%- if values.enableArgoCD or values.enableTekton %}
  devops:
    instanceSize: ${{ values.devopsInstanceSize }}
{%- endif %}
